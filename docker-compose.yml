
services:
  postgres:
    image: postgres:15
    container_name: quickweather-postgres
    environment:
      POSTGRES_DB: quickweather
      POSTGRES_USER: quickweather
      POSTGRES_PASSWORD: quickweather
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U quickweather" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickweather-network

  mailhog:
    image: mailhog/mailhog
    container_name: quickweather-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - quickweather-network

  backend:
    build: .
    container_name: quickweather-backend
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - quickweather-network

volumes:
  postgres_data:

networks:
  quickweather-network:
